version: '3.8'

services:
  # PostgreSQL Database for Kong
  kong-db:
    image: postgres:15-alpine
    container_name: ummu-kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong123
    volumes:
      - kong_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ummu-network

  # Kong Migrations
  kong-migration:
    image: kong:3.4-alpine
    container_name: ummu-kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    networks:
      - ummu-network

  # Kong API Gateway
  kong:
    image: kong:3.4-alpine
    container_name: ummu-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,opentelemetry
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy SSL
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin SSL
    depends_on:
      - kong-db
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - ummu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    image: auth-service:latest
    container_name: ummu-auth-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://auth_user:auth123@postgres:5432/auth_db
      JWT_SECRET: your_jwt_secret_key_change_this
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - otel-collector
    networks:
      - ummu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Services
  postgres:
    image: postgres:15-alpine
    container_name: ummu-postgres
    environment:
      POSTGRES_DB: ummu_db
      POSTGRES_USER: ummu_user
      POSTGRES_PASSWORD: ummu123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - ummu-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ummu_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ummu-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"  # Jaeger compact thrift
      - "6832:6832/udp"  # Jaeger binary thrift
      - "5778:5778"       # Jaeger HTTP serve traces
      - "16686:16686"     # Jaeger UI
      - "4317:4317"       # OTLP gRPC receiver
      - "4318:4318"       # OTLP HTTP receiver
    networks:
      - ummu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: ummu-otel-collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
      - "9411:9411"       # Zipkin
      - "14250:14250"     # Jaeger gRPC
    depends_on:
      - jaeger
    networks:
      - ummu-network

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ummu-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ummu-network
    depends_on:
      - kong
      - auth-service

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ummu-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - ummu-network
    depends_on:
      - prometheus

networks:
  ummu-network:
    driver: bridge

volumes:
  kong_data:
  postgres_data:
  prometheus_data:
  grafana_data:


